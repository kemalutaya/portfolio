<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Chart preparation pipeline in five steps, ending in ready or escalate">
  <rect width="640" height="360" fill="#0B1720"/>
  <rect x="0.5" y="0.5" width="639" height="359" fill="none" stroke="#19B5A5" stroke-opacity="0.35"/>
  <text x="36" y="52" font-family="Consolas,Menlo,monospace" font-size="14" letter-spacing="2.2" fill="#19B5A5">CHART PREP &#183; SAME METHOD, EVERY CHART</text>
  <g font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#F5F7F6" text-anchor="middle">
    <rect x="36"  y="120" width="104" height="80" rx="9" fill="#16242E" stroke="#19B5A5" stroke-opacity="0.35"/><text x="88"  y="104" font-family="Consolas,Menlo,monospace" font-size="11" fill="#93A6A2" font-weight="400">01</text><text x="88"  y="156">Tomorrow&#8217;s</text><text x="88"  y="176">schedule</text>
    <rect x="152" y="120" width="104" height="80" rx="9" fill="#16242E" stroke="#19B5A5" stroke-opacity="0.35"/><text x="204" y="104" font-family="Consolas,Menlo,monospace" font-size="11" fill="#93A6A2" font-weight="400">02</text><text x="204" y="156">Pull the</text><text x="204" y="176">record</text>
    <rect x="268" y="120" width="104" height="80" rx="9" fill="#16242E" stroke="#19B5A5" stroke-opacity="0.35"/><text x="320" y="104" font-family="Consolas,Menlo,monospace" font-size="11" fill="#93A6A2" font-weight="400">03</text><text x="320" y="156">Allergies,</text><text x="320" y="176">dx, meds</text>
    <rect x="384" y="120" width="104" height="80" rx="9" fill="#16242E" stroke="#19B5A5" stroke-opacity="0.35"/><text x="436" y="104" font-family="Consolas,Menlo,monospace" font-size="11" fill="#93A6A2" font-weight="400">04</text><text x="436" y="156">Flag what&#8217;s</text><text x="436" y="176">missing</text>
    <rect x="500" y="120" width="104" height="80" rx="9" fill="#1C2C37" stroke="#19B5A5" stroke-opacity="0.7"/><text x="552" y="104" font-family="Consolas,Menlo,monospace" font-size="11" fill="#93A6A2" font-weight="400">05</text><text x="552" y="156">Ready, or</text><text x="552" y="176">escalate</text>
  </g>
  <g stroke="#19B5A5" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M142 160 H150 M146 156 L150 160 L146 164"/><path d="M258 160 H266 M262 156 L266 160 L262 164"/><path d="M374 160 H382 M378 156 L382 160 L378 164"/><path d="M490 160 H498 M494 156 L498 160 L494 164"/>
  </g>
  <line x1="36" y1="244" x2="604" y2="244" stroke="#F5F7F6" stroke-opacity="0.14"/>
  <text x="36" y="276" font-family="Consolas,Menlo,monospace" font-size="12" letter-spacing="1.6" fill="#19B5A5">THE BOUNDARY</text>
  <text x="36" y="304" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" fill="#B9C8C4">Step 05 escalates rather than decides. Clinical judgement</text>
  <text x="36" y="326" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" fill="#B9C8C4">stays with licensed personnel.</text>
</svg>
