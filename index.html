<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kem Alutaya | Medical Virtual Administrative Assistant</title>
    <meta name="description" content="Kem Alutaya, Medical Virtual Administrative Assistant based in the Philippines, providing insurance verification, EMR support, chart preparation, and back-office healthcare administrative support for U.S. and UK healthcare teams." />
    <meta name="author" content="Kem Alutaya" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0B1720" />
    <link rel="canonical" href="https://kemalutaya.github.io/portfolio/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The rail avatar is above the fold on every desktop route. Keep this in
         sync with profile.avatarSrc in src/data/profile.ts. -->
    <link rel="preload" as="image" href="/kem-alutaya.jpg" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share. og:image must be an absolute URL once you deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kem Alutaya" />
    <meta property="og:title" content="Kem Alutaya | Medical Virtual Administrative Assistant" />
    <meta property="og:description" content="Insurance verification, EMR support, chart preparation, and healthcare back-office documentation for U.S. and UK healthcare teams." />
    <meta property="og:url" content="https://kemalutaya.github.io/portfolio/" />
    <meta property="og:image" content="https://kemalutaya.github.io/portfolio/og-image.jpg" />
    <meta name="twitter:card" content="summary" />

    <!-- Theme before first paint: no flash of the wrong palette. Default is
         light; dark is the visitor's opt-in, persisted in localStorage. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
